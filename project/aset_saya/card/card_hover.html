<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Hover Animation · 3D Interactive Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #0b0e1a, #05070e);
            font-family: 'Inter', sans-serif;
            padding: 2rem;
        }

        /* ----- CARD CONTAINER ----- */
        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5rem;
            justify-content: center;
            align-items: stretch;
            max-width: 1200px;
            width: 100%;
        }

        /* ----- CARD ROOT ----- */
        .card {
            --card-width: 280px;
            --card-height: 400px;
            width: var(--card-width);
            height: var(--card-height);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 0 20px 30px;
            perspective: 2500px;
            border-radius: 16px;
            flex-shrink: 0;
            transition: filter 0.3s ease;
            cursor: default;
        }

        .card:hover {
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6));
        }

        /* ----- INNER WRAPPER (the 3D plane) ----- */
        .card-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            will-change: transform;
        }

        .card:hover .card-wrapper {
            transform: rotateY(8deg) rotateX(6deg) scale(1.02);
        }

        /* ----- GLOW OVERLAY (::before & ::after from screenshot) ----- */
        .card-wrapper::before,
        .card-wrapper::after {
            content: "";
            position: absolute;
            left: 0;
            width: 100%;
            height: 60%;
            border-radius: 16px;
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
            z-index: 2;
        }

        .card-wrapper::before {
            top: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, transparent 100%);
            transform: translateY(-20px);
        }

        .card-wrapper::after {
            bottom: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.4) 0%, transparent 100%);
            transform: translateY(20px);
        }

        .card:hover .card-wrapper::before {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover .card-wrapper::after {
            opacity: 1;
            transform: translateY(0);
        }

        /* ----- CARD BACKGROUND (art) ----- */
        .card-bg {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            background-color: #1a1e2e;
            z-index: 0;
            transition: transform 0.6s ease;
            transform: scale(1);
            will-change: transform;
        }

        .card:hover .card-bg {
            transform: scale(1.04);
        }

        /* Overlay gelap di atas bg biar teks terbaca */
        .card-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.6) 100%);
            z-index: 1;
        }

        /* ----- CARD CONTENT (z-index di atas segalanya) ----- */
        .card-content {
            position: relative;
            z-index: 10;
            color: #fff;
            text-align: center;
            width: 100%;
            transform: translateZ(30px);
            transition: transform 0.6s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .card:hover .card-content {
            transform: translateZ(40px) translateY(-4px);
        }

        /* ----- BADGE / TAG ----- */
        .card-tag {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            letter-spacing: -0.01em;
        }

        .card-subtitle {
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.8;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .card-divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            margin: 6px 0;
            opacity: 0.5;
        }

        .card-action {
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 24px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.20);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .card-action:hover {
            background: rgba(255, 255, 255, 0.20);
            border-color: rgba(255, 255, 255, 0.40);
            transform: scale(1.04);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card-action i {
            font-size: 0.75rem;
        }

        /* ----- VARIANTS (beda warna aksen) ----- */
        .card.accent-blue .card-tag {
            background: rgba(37, 99, 235, 0.35);
            border-color: rgba(37, 99, 235, 0.4);
        }
        .card.accent-blue .card-action {
            border-color: rgba(37, 99, 235, 0.4);
        }
        .card.accent-blue .card-action:hover {
            background: rgba(37, 99, 235, 0.25);
        }

        .card.accent-purple .card-tag {
            background: rgba(168, 85, 247, 0.35);
            border-color: rgba(168, 85, 247, 0.4);
        }
        .card.accent-purple .card-action {
            border-color: rgba(168, 85, 247, 0.4);
        }
        .card.accent-purple .card-action:hover {
            background: rgba(168, 85, 247, 0.25);
        }

        .card.accent-rose .card-tag {
            background: rgba(244, 63, 94, 0.35);
            border-color: rgba(244, 63, 94, 0.4);
        }
        .card.accent-rose .card-action {
            border-color: rgba(244, 63, 94, 0.4);
        }
        .card.accent-rose .card-action:hover {
            background: rgba(244, 63, 94, 0.25);
        }

        .card.accent-amber .card-tag {
            background: rgba(217, 119, 6, 0.35);
            border-color: rgba(217, 119, 6, 0.4);
        }
        .card.accent-amber .card-action {
            border-color: rgba(217, 119, 6, 0.4);
        }
        .card.accent-amber .card-action:hover {
            background: rgba(217, 119, 6, 0.25);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .cards-grid {
                gap: 1.8rem;
            }
            .card {
                --card-width: 240px;
                --card-height: 350px;
                padding: 0 16px 24px;
            }
            .card-title {
                font-size: 1.2rem;
            }
            .card-subtitle {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 500px) {
            .card {
                --card-width: 200px;
                --card-height: 300px;
                padding: 0 12px 18px;
            }
            .card-title {
                font-size: 1rem;
            }
            .card-subtitle {
                font-size: 0.65rem;
            }
            .card-tag {
                font-size: 0.5rem;
                padding: 2px 12px;
            }
            .card-action {
                padding: 6px 16px;
                font-size: 0.6rem;
            }
        }

        /* tambahan efek floating */
        .card {
            animation: float 6s ease-in-out infinite;
        }
        .card:nth-child(2) {
            animation-delay: 0.8s;
        }
        .card:nth-child(3) {
            animation-delay: 1.6s;
        }
        .card:nth-child(4) {
            animation-delay: 2.4s;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .card:hover {
            animation-play-state: paused;
        }

        /* efek glow pada hover */
        .card::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: -1;
            filter: blur(8px);
        }
        .card:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="cards-grid">

        <!-- ===== CARD 1 — MARK TRIDER ===== -->
        <div class="card accent-blue">
            <div class="card-wrapper">
                <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?w=600&h=800&fit=crop&q=80');"></div>
                <div class="card-content">
                    <span class="card-tag"><i class="fas fa-bolt" style="margin-right:6px;"></i>Legendary</span>
                    <h2 class="card-title">THE MARK TRIDER</h2>
                    <p class="card-subtitle">Chris Martin</p>
                    <div class="card-divider"></div>
                    <p class="card-subtitle" style="font-size:0.65rem; opacity:0.6; letter-spacing:0.05em;">FORCE MAGE</p>
                    <a href="#" class="card-action"><i class="fas fa-arrow-right"></i> Explore</a>
                </div>
            </div>
        </div>

        <!-- ===== CARD 2 — NEXUS PHANTOM ===== -->
        <div class="card accent-purple">
            <div class="card-wrapper">
                <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1600267185393-e158a98703de?w=600&h=800&fit=crop&q=80');"></div>
                <div class="card-content">
                    <span class="card-tag"><i class="fas fa-crown" style="margin-right:6px;"></i>Flagship</span>
                    <h2 class="card-title">NEXUS PHANTOM</h2>
                    <p class="card-subtitle">X · Pro Max</p>
                    <div class="card-divider"></div>
                    <p class="card-subtitle" style="font-size:0.65rem; opacity:0.6; letter-spacing:0.05em;">Snapdragon 8 Gen 5</p>
                    <a href="#" class="card-action"><i class="fas fa-cart-plus"></i> Pre-order</a>
                </div>
            </div>
        </div>

        <!-- ===== CARD 3 — AURORA EDGE ===== -->
        <div class="card accent-rose">
            <div class="card-wrapper">
                <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1616348436168-de43ad0db179?w=600&h=800&fit=crop&q=80');"></div>
                <div class="card-content">
                    <span class="card-tag"><i class="fas fa-gem" style="margin-right:6px;"></i>Limited</span>
                    <h2 class="card-title">AURORA EDGE</h2>
                    <p class="card-subtitle">Vivo · Zeiss Optics</p>
                    <div class="card-divider"></div>
                    <p class="card-subtitle" style="font-size:0.65rem; opacity:0.6; letter-spacing:0.05em;">200MP · 120W</p>
                    <a href="#" class="card-action"><i class="fas fa-eye"></i> View</a>
                </div>
            </div>
        </div>

        <!-- ===== CARD 4 — STELLAR SHADOW ===== -->
        <div class="card accent-amber">
            <div class="card-wrapper">
                <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1589492477829-5e65395b66cc?w=600&h=800&fit=crop&q=80');"></div>
                <div class="card-content">
                    <span class="card-tag"><i class="fas fa-rocket" style="margin-right:6px;"></i>Ultimate</span>
                    <h2 class="card-title">STELLAR SHADOW</h2>
                    <p class="card-subtitle">Xiaomi · Ultra</p>
                    <div class="card-divider"></div>
                    <p class="card-subtitle" style="font-size:0.65rem; opacity:0.6; letter-spacing:0.05em;">1-inci Leica · 5300mAh</p>
                    <a href="#" class="card-action"><i class="fas fa-arrow-right"></i> Discover</a>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== OPTIONAL: MOUSE TRACKING 3D ===== -->
    <script>
        (function() {
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const wrapper = card.querySelector('.card-wrapper');

                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -6; // max 6deg
                    const rotateY = ((x - centerX) / centerX) * 6;

                    wrapper.style.transform =
                        `rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.02)`;
                });

                card.addEventListener('mouseleave', () => {
                    wrapper.style.transform = 'rotateY(0deg) rotateX(0deg) scale(1)';
                    wrapper.style.transition = 'transform 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
                });

                card.addEventListener('mouseenter', () => {
                    wrapper.style.transition = 'transform 0.1s ease-out';
                });
            });
        })();
    </script>

</body>
</html>
