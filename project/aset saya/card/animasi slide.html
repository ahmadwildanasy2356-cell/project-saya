<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPC | TRAVEL – Savour The Journey</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            crimson: '#DC2626',
            slate: { 900: '#0F172A' },
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Playfair Display"', 'serif'],
          },
        },
      },
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: #0F172A;
    }

    /* ===== MAIN CONTAINER ===== */
    main {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* ===== ARTICLE SLIDES ===== */
    article {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: var(--i, 0);
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      will-change: opacity;
    }

    article.active {
      opacity: 1;
    }

    article img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      will-change: transform;
    }

    /* ===== OVERLAY GRADASI ===== */
    .slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.6) 0%, rgba(15, 23, 42, 0.2) 50%, rgba(15, 23, 42, 0.5) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* ===== HERO INFO ===== */
    .hero-info {
      position: absolute;
      top: 50%;
      left: 5%;
      transform: translateY(-50%);
      z-index: 8;
      max-width: 560px;
      pointer-events: none;
    }

    /* ===== BADGE ===== */
    .badge {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #DC2626;
      border: 1px solid rgba(220, 38, 38, 0.3);
      padding: 0.4rem 1.2rem;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 1rem;
      background: rgba(220, 38, 38, 0.08);
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }

    /* ===== LEVEL-1 TYPOGRAPHY ===== */
    .Level-1 h3 {
      font-weight: 600;
      font-size: 1.8rem;
      text-transform: uppercase;
      color: #FFFFFF;
      letter-spacing: 0.02em;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.4);
    }

    .Level-1 h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 5rem;
      line-height: 1.05;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 0.5rem;
    }

    .Level-1 p {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.7;
      max-width: 400px;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
    }

    .level-1 p small {
      font-size: 1rem;
      opacity: 0.5;
      cursor: pointer;
      transition: opacity 0.3s;
      font-weight: 400;
      display: inline-block;
      margin-top: 0.5rem;
      color: #FFFFFF;
      pointer-events: auto;
    }

    .level-1 p small:hover {
      opacity: 1;
    }

    /* ===== NAVIGATION TOP ===== */
    .nav-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 3rem;
      pointer-events: none;
    }

    .nav-top .logo {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #FFFFFF;
      text-transform: uppercase;
      pointer-events: auto;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
    }

    .nav-top .logo span {
      color: #DC2626;
    }

    .nav-top .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      pointer-events: auto;
      padding: 4px;
    }

    .nav-top .hamburger span {
      display: block;
      width: 28px;
      height: 2px;
      background: #DC2626;
      border-radius: 2px;
      transition: 0.3s;
    }

    /* ===== SLIDER CONTROLS ===== */
    .slider-controls {
      position: absolute;
      bottom: 3rem;
      right: 3rem;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      pointer-events: none;
    }

    .slider-controls .indicator {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.1em;
      pointer-events: auto;
      cursor: default;
    }

    .slider-controls .indicator span {
      color: #FFFFFF;
      font-weight: 600;
    }

    .slider-controls button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      font-size: 1.2rem;
    }

    .slider-controls button:hover {
      background: rgba(220, 38, 38, 0.2);
      border-color: #DC2626;
      transform: scale(1.05);
    }

    .slider-controls button:active {
      transform: scale(0.95);
    }

    /* ===== PROGRESS BAR (opsional) ===== */
    .progress-dots {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: flex;
      gap: 0.8rem;
      pointer-events: none;
    }

    .progress-dots .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      transition: all 0.4s;
      cursor: pointer;
      pointer-events: auto;
    }

    .progress-dots .dot.active {
      background: #DC2626;
      border-color: #DC2626;
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.3);
      transform: scale(1.15);
    }

    .progress-dots .dot:hover {
      border-color: #DC2626;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .hero-info {
        left: 4%;
        max-width: 90%;
      }

      .Level-1 h1 {
        font-size: 3rem;
      }

      .Level-1 h3 {
        font-size: 1.2rem;
      }

      .Level-1 p {
        font-size: 0.95rem;
        max-width: 100%;
      }

      .nav-top {
        padding: 1.2rem 1.5rem;
      }

      .slider-controls {
        bottom: 2rem;
        right: 1.5rem;
        gap: 1rem;
      }

      .slider-controls button {
        width: 38px;
        height: 38px;
        font-size: 1rem;
      }

      .progress-dots {
        bottom: 2rem;
        gap: 0.6rem;
      }

      .progress-dots .dot {
        width: 8px;
        height: 8px;
      }
    }

    @media (max-width: 480px) {
      .Level-1 h1 {
        font-size: 2.2rem;
      }

      .Level-1 h3 {
        font-size: 1rem;
      }

      .Level-1 p {
        font-size: 0.85rem;
      }

      .nav-top .logo {
        font-size: 0.9rem;
      }

      .badge {
        font-size: 0.6rem;
        padding: 0.3rem 0.8rem;
      }
    }
  </style>
</head>
<body>

  <main>

    <!-- ===== NAVIGATION TOP ===== -->
    <div class="nav-top">
      <div class="logo">CPC <span>|</span> TRAVEL</div>
      <div class="hamburger" id="hamburgerMenu">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- ===== SLIDE 1 ===== -->
    <article id="slide1" class="active" style="--i: 3;">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1400&q=80" alt="Mountain adventure" loading="eager" />
      <div class="slide-overlay"></div>
    </article>

    <!-- ===== SLIDE 2 ===== -->
    <article id="slide2" style="--i: 2;">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1400&q=80" alt="Forest lake" loading="lazy" />
      <div class="slide-overlay"></div>
    </article>

    <!-- ===== SLIDE 3 ===== -->
    <article id="slide3" style="--i: 1;">
      <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1400&q=80" alt="Starry night" loading="lazy" />
      <div class="slide-overlay"></div>
    </article>

    <!-- ===== HERO INFO ===== -->
    <div class="hero-info">
      <div class="badge">CPC | TRAVEL</div>
      <div class="Level-1" id="slideContent">
        <h3>Explore the wild</h3>
        <h1>Savour<br />The Journey</h1>
        <p>
          Discover breathtaking landscapes and unforgettable adventures.
          <br />
          <small id="locationLabel">Marignier, France</small>
        </p>
      </div>
    </div>

    <!-- ===== PROGRESS DOTS ===== -->
    <div class="progress-dots" id="progressDots">
      <span class="dot active" data-index="0"></span>
      <span class="dot" data-index="1"></span>
      <span class="dot" data-index="2"></span>
    </div>

    <!-- ===== SLIDER CONTROLS ===== -->
    <div class="slider-controls">
      <span class="indicator" id="slideIndicator">01 <span>/ 03</span></span>
      <button id="prevSlide" aria-label="Previous slide">‹</button>
      <button id="nextSlide" aria-label="Next slide">›</button>
    </div>

  </main>

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    /**
     * ============================================================
     *  CPC | TRAVEL – Savour The Journey
     *  Carousel slider dengan z-index layering, opacity transition.
     *  Semua logic wrapped dalam DOMContentLoaded, optional chaining (?.)
     * ============================================================
     */
    document.addEventListener('DOMContentLoaded', function() {

      // =============================================================
      //  1. DOM REFERENCES
      // =============================================================
      const slides = [
        document.querySelector('#slide1'),
        document.querySelector('#slide2'),
        document.querySelector('#slide3'),
      ];

      const dots = document.querySelectorAll('.dot');
      const indicator = document.querySelector('#slideIndicator');
      const prevBtn = document.querySelector('#prevSlide');
      const nextBtn = document.querySelector('#nextSlide');
      const locationLabel = document.querySelector('#locationLabel');

      // Data untuk setiap slide (judul, subtitle, lokasi)
      const slideData = [
        {
          title: 'Explore the wild',
          subtitle: 'Savour The Journey',
          location: 'Marignier, France',
        },
        {
          title: 'Wander the forests',
          subtitle: 'Find Your Peace',
          location: 'Whistler, Canada',
        },
        {
          title: 'Chase the stars',
          subtitle: 'Beyond The Horizon',
          location: 'Tromsø, Norway',
        },
      ];

      let currentIndex = 0;
      const totalSlides = slides.length;

      // =============================================================
      //  2. UPDATE SLIDE FUNCTION
      // =============================================================
      function updateSlide(index) {
        // Validasi index
        if (index < 0) index = totalSlides - 1;
        if (index >= totalSlides) index = 0;

        currentIndex = index;

        // Update slides opacity
        slides.forEach((slide, i) => {
          if (!slide) return;
          if (i === index) {
            slide.classList.add('active');
          } else {
            slide.classList.remove('active');
          }
        });

        // Update dots
        dots.forEach((dot, i) => {
          if (!dot) return;
          if (i === index) {
            dot.classList.add('active');
          } else {
            dot.classList.remove('active');
          }
        });

        // Update indicator
        if (indicator) {
          const currentNum = String(index + 1).padStart(2, '0');
          const totalNum = String(totalSlides).padStart(2, '0');
          indicator.innerHTML = `${currentNum} <span>/ ${totalNum}</span>`;
        }

        // Update content (Level-1)
        const data = slideData[index];
        if (data) {
          const level1 = document.querySelector('.Level-1');
          if (level1) {
            const h3 = level1.querySelector('h3');
            const h1 = level1.querySelector('h1');
            const p = level1.querySelector('p');
            if (h3) h3.textContent = data.title;
            if (h1) h1.textContent = data.subtitle;
            if (p && locationLabel) {
              // Update hanya bagian <small>
              locationLabel.textContent = data.location;
            }
          }
        }
      }

      // =============================================================
      //  3. NAVIGATION EVENTS
      // =============================================================
      // Next button
      nextBtn?.addEventListener('click', function() {
        updateSlide(currentIndex + 1);
      });

      // Previous button
      prevBtn?.addEventListener('click', function() {
        updateSlide(currentIndex - 1);
      });

      // Dot clicks
      dots.forEach((dot, index) => {
        dot?.addEventListener('click', function() {
          updateSlide(index);
        });
      });

      // Keyboard navigation
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          updateSlide(currentIndex + 1);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          updateSlide(currentIndex - 1);
        }
      });

      // =============================================================
      //  4. HAMBURGER MENU – (state machine)
      // =============================================================
      const hamburger = document.querySelector('#hamburgerMenu');
      let menuOpen = false;

      hamburger?.addEventListener('click', function() {
        menuOpen = !menuOpen;
        const bars = this.querySelectorAll('span');
        if (bars.length === 3) {
          if (menuOpen) {
            bars[0].style.transform = 'rotate(45deg) translate(6px, 6px)';
            bars[1].style.opacity = '0';
            bars[2].style.transform = 'rotate(-45deg) translate(6px, -6px)';
          } else {
            bars[0].style.transform = 'none';
            bars[1].style.opacity = '1';
            bars[2].style.transform = 'none';
          }
        }
        // Simple feedback (bisa ditambahkan menu dropdown jika diperlukan)
        console.log('Menu toggled:', menuOpen ? 'OPEN' : 'CLOSED');
      });

      // =============================================================
      //  5. AUTO-PLAY (opsional – nonaktif agar user kontrol penuh)
      // =============================================================
      // Tidak ada auto-play untuk menghindari konflik dengan interaksi user

      // =============================================================
      //  6. INITIALIZATION
      // =============================================================
      updateSlide(0);

      console.log('✅ CPC | TRAVEL – Carousel siap dan stabil.');
    });
  </script>

</body>
</html>
